<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="470" fill="#ffffff"/>

  <!-- internal network zone -->
  <rect x="300" y="20" width="520" height="430" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="8 6"/>
  <text x="800" y="44" text-anchor="end" font-size="15" font-weight="700" fill="#15803d">내부망 (외부에서 직접 접근 불가)</text>

  <!-- firewall -->
  <rect x="262" y="20" width="22" height="430" fill="#f97316"/>
  <text transform="translate(278,375) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">방화벽 (21번만 허용)</text>

  <!-- attacker -->
  <rect x="30" y="185" width="200" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">공격자</text>
  <text x="130" y="252" text-anchor="middle" font-size="14" fill="#7f1d1d">외부 인터넷</text>

  <!-- ftp server -->
  <rect x="360" y="70" width="210" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">FTP 서버</text>
  <text x="465" y="137" text-anchor="middle" font-size="14" fill="#1e3a8a">PORT 목적지를 검사하지 않음</text>

  <!-- internal pc -->
  <rect x="590" y="320" width="210" height="100" rx="10" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
  <text x="695" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#365314">내부 PC</text>
  <text x="695" y="385" text-anchor="middle" font-size="14" fill="#365314">10.0.0.5 : 25번 포트</text>

  <!-- 1. attacker -> ftp -->
  <line x1="230" y1="200" x2="358" y2="110" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="20" y="60" width="232" height="58" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="32" y="84" font-size="14" font-weight="700" fill="#1f2937">① 로그인 후 명령 전송</text>
  <text x="32" y="106" font-size="14" font-family="Consolas,monospace" fill="#1f2937">PORT 10,0,0,5,0,25</text>

  <!-- 2. ftp -> internal -->
  <line x1="500" y1="170" x2="660" y2="318" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ahb)"/>
  <rect x="600" y="190" width="200" height="58" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="612" y="214" font-size="14" font-weight="700" fill="#1e40af">② 서버가 대신 접속</text>
  <text x="612" y="236" font-size="13" fill="#1e40af">10.0.0.5의 25번 포트로</text>

  <!-- 3. ftp -> attacker response -->
  <line x1="358" y1="150" x2="232" y2="240" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <rect x="300" y="205" width="200" height="58" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="312" y="229" font-size="14" font-weight="700" fill="#1f2937">③ 응답 코드로 결과 판단</text>
  <text x="312" y="251" font-size="13" fill="#1f2937">150 → 열림 / 425 → 닫힘</text>

  <!-- blocked direct path -->
  <line x1="230" y1="270" x2="588" y2="370" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 5"/>
  <g transform="translate(273,282)">
    <circle r="16" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="#dc2626" stroke-width="3"/>
  </g>
  <text x="320" y="378" font-size="13" fill="#b91c1c">직접 접속은 방화벽이 차단</text>
</svg>
